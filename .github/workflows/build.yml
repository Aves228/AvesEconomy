name: Build AvesEconomy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build plugin
        run: mvn --batch-mode --errors clean package

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AvesEconomy
          path: target/*.jar
